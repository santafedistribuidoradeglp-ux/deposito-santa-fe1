crons:
  - name: ranking-bonus
    description: "Premia com crédito bônus o nº 1 do ranking de indicações do mês anterior (dia 1, 03h UTC)"
    cron: "0 3 1 * *"
    endpoint: "{{BASE_URL}}/api/cron/ranking-bonus"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
